# Paramix baseline CI
#
# Scope: build the application on the four v1 targets and run the unit test
# suite on Linux. Packaging, signing, model downloads and stem separation are
# intentionally out of scope for the baseline; those arrive with the feature
# branches. No model weights are downloaded by CI.
#
# This workflow is fork-owned (not a copy of upstream's release pipeline) so it
# works without maintainer secrets, self-hosted runners or deployment steps.
#
# Environment propagation note: tools/macos_buildenv.sh and
# tools/windows_buildenv.bat append their exported variables
# (MIXXX_VCPKG_ROOT, VCPKG_TARGET_TRIPLET, BUILDENV_URL, CMAKE_GENERATOR, ...)
# to $GITHUB_ENV themselves when GITHUB_ENV is set, so variables set in the
# "Set up build environment" step ARE visible to the later Configure/Build
# steps. No cross-step sourcing is required on GitHub-hosted runners.

name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Two commits so the whitespace gate can diff the pushed change.
          fetch-depth: 2

      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |======= |>>>>>>> )' -- ':!*.md'; then
            echo "Merge conflict markers found" >&2
            exit 1
          fi

      - name: Check whitespace errors
        # Only the pushed commit is checked. The imported Mixxx tree contains
        # pre-existing trailing whitespace, so checking the whole tree (or the
        # import commit itself) would always fail for reasons unrelated to the
        # change under test. Skips cleanly on a root commit.
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            echo "Root commit: skipping whitespace diff"
          fi

      - name: Validate YAML and JSON
        # pip may refuse to install into the externally managed system
        # environment (PEP 668); retry with --break-system-packages.
        run: |
          python3 -m pip install --quiet pyyaml || \
            python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml

          errors = []
          for path in pathlib.Path(".").rglob("*"):
              if ".git" in path.parts:
                  continue
              if path.suffix in {".yml", ".yaml"}:
                  try:
                      with path.open("rb") as f:
                          yaml.safe_load(f)
                  except Exception as exc:
                      errors.append(f"{path}: {exc}")
              elif path.suffix == ".json":
                  try:
                      json.loads(path.read_text())
                  except Exception as exc:
                      errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("YAML/JSON OK")
          PY

      - name: Check clang-format on changed C++ files
        # Whole-tree clang-format would fail on imported legacy code, so only
        # the files changed by this push/PR are checked. The pinned version
        # matches .pre-commit-config.yaml, which runs the fixer locally.
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet clang-format==19.1.3 || \
            python3 -m pip install --quiet --break-system-packages clang-format==19.1.3
          cf_ver="$(clang-format --version)"
          echo "$cf_ver"
          case "$cf_ver" in
            *19.1.3*) ;;
            *)
              echo "ERROR: expected clang-format 19.1.3, got: $cf_ver" >&2
              exit 1
              ;;
          esac

          # Base ref: the pre-push tip when it resolves (guarded by merge-base
          # against force pushes), otherwise HEAD^. On pull_request HEAD^ is the
          # first parent of the merge ref, i.e. the base branch tip.
          base=""
          if [ -n "${PUSH_BEFORE:-}" ] &&
            [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            if mb="$(git merge-base "${PUSH_BEFORE}" HEAD 2>/dev/null)"; then
              base="${mb}"
            fi
          fi
          if [ -z "$base" ]; then
            if git rev-parse --verify --quiet HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
            else
              echo "No base commit available (root commit): skipping clang-format check"
              exit 0
            fi
          fi
          echo "Comparing against base: $base"

          # Changed C++ files only; deletions dropped, renames checked at the
          # new path, vendored/generated trees excluded like pre-commit does.
          changed="$(git -c core.quotePath=false diff --name-only "$base" HEAD \
            --diff-filter=ACMR -- \
            '*.cpp' '*.h' '*.hpp' '*.cc' \
            ':(exclude)lib' \
            ':(exclude)src/*_anlz.h' \
            ':(exclude)src/*_pdb.h' \
            ':(exclude)src/test/*data')"
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            files+=("$f")
          done <<< "$changed"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C++ files to check"
            exit 0
          fi
          echo "Checking ${#files[@]} changed C++ file(s):"
          printf '  %s\n' "${files[@]}"
          clang-format --dry-run --Werror --style=file "${files[@]}"

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        # Installs the build dependencies via apt (passwordless sudo on the
        # hosted runner). Qt 6 is the only supported Qt major in this tree;
        # the script also installs the QML module packages.
        run: tools/debian_buildenv.sh setup

      - name: Restore ccache cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: linux-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            linux-

      - name: Set up ccache
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: Configure
        # There is no QT6 CMake option in this tree; Qt 6 is mandatory and
        # always used. QML is the dependent option at CMakeLists.txt:2356
        # (defaults ON when Qt >= 6.4). CMake enables ccache automatically
        # when it is on PATH (CCACHE_SUPPORT, CMakeLists.txt).
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQML=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Print compiler cache stats
        run: |
          ccache --show-stats
          ccache --cleanup

      - name: Save ccache cache
        # Save only on pushes to limit private-repo cache churn; skip when an
        # entry for this exact key already exists, else the save step fails.
        if: >-
          github.event_name == 'push' &&
          steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: linux-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          CTEST_PARALLEL_LEVEL: 3

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install ccache
        run: brew install ccache

      - name: Set up build environment
        # Executed on Actions the script persists its environment by writing
        # to $GITHUB_ENV (verified in tools/macos_buildenv.sh); sourcing it
        # also works. It selects the arm64 prebuilt vcpkg environment based
        # on the host architecture and does not download anything itself;
        # the Configure step fetches the environment via BUILDENV_URL.
        run: source tools/macos_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: ${{ runner.workspace }}/buildenv

      - name: Restore ccache cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: macos-arm64-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            macos-arm64-

      - name: Set up ccache
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: Configure
        # No QT6 option exists; QML is ON for arm64 (the dependent option at
        # CMakeLists.txt:2356). MIXXX_VCPKG_ROOT, VCPKG_TARGET_TRIPLET and
        # CMAKE_GENERATOR=Ninja come from the buildenv script via $GITHUB_ENV.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQML=ON

      - name: Build
        # Ninja (from the buildenv script) parallelizes by default.
        run: cmake --build build --config RelWithDebInfo

      - name: Print compiler cache stats
        run: |
          ccache --show-stats
          ccache --cleanup

      - name: Save ccache cache
        if: >-
          github.event_name == 'push' &&
          steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: macos-arm64-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}

  macos-x64:
    name: macOS x86_64
    runs-on: macos-15-intel
    # Intel runners are ~2.3x slower than arm64 on this tree (measured: 60m44s
    # vs 26m16s build, 1h15m46s vs 39m49s job) and additionally pull a 3.7 GB
    # build environment. That left only 14 minutes of headroom at 90 minutes.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install ccache
        run: brew install ccache

      - name: Set up build environment
        # See the arm64 job: the script persists its environment via
        # $GITHUB_ENV; on an x86_64 host it selects the x64 prebuilt env.
        run: source tools/macos_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: ${{ runner.workspace }}/buildenv

      - name: Restore ccache cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: macos-x64-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            macos-x64-

      - name: Set up ccache
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: Configure
        # No QT6 option exists; QML stays OFF for the x86_64 target.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQML=OFF

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Print compiler cache stats
        run: |
          ccache --show-stats
          ccache --cleanup

      - name: Save ccache cache
        if: >-
          github.event_name == 'push' &&
          steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: macos-x64-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up build environment
        # shell: cmd so the batch file's ERRORLEVEL is checked. With
        # BUILDENV_RELEASE set the script selects the x64-windows-release
        # prebuilt environment and appends MIXXX_VCPKG_ROOT, VCPKG_TARGET_
        # TRIPLET, CMAKE_GENERATOR=Ninja and BUILDENV_* to $GITHUB_ENV
        # (verified in tools/windows_buildenv.bat), so the later
        # Configure/Build steps see them without cross-step propagation.
        shell: cmd
        run: tools\windows_buildenv.bat setup
        env:
          BUILDENV_BASEPATH: C:\buildenv
          BUILDENV_RELEASE: "TRUE"

      - name: Configure
        # No QT6 option exists; QML is ON (dependent option at
        # CMakeLists.txt:2356). MIXXX_VCPKG_ROOT drives the vcpkg toolchain;
        # no explicit CMAKE_PREFIX_PATH is needed.
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DQML=ON

      - name: Build
        # Ninja (from the buildenv script) parallelizes by default;
        # --config is a no-op for the single-config Ninja generator.
        run: cmake --build build --config RelWithDebInfo
